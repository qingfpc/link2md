[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "link2md"
version = "0.1.0"
description = "把社交平台和网页链接整理成 Obsidian Markdown 笔记"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "link2md" }]
keywords = ["obsidian", "markdown", "bilibili", "xiaoyuzhou", "wechat"]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "trafilatura>=2.0",
  "markdownify>=0.13",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "yt-dlp>=2024.8",
  "platformdirs>=4",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
cloud = ["dashscope>=1.20"]
dev = ["pytest>=8"]

[project.scripts]
link2md = "link2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
link2md = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
